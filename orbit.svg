<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 60" width="700" height="60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .v { stroke: #E0479E; } .vf { fill: #E0479E; } .t { stroke: #B8327E; } .tf { fill: #B8327E; }
    .scan { opacity: 0; animation: scan 3s ease 2.6s forwards; }
    @keyframes scan { 0% { opacity: 0; } 30% { opacity: .35; } 100% { opacity: .18; } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: .18; } }
    
    @media (prefers-color-scheme: dark) {
      .v { stroke: #FF8AC8; } .vf { fill: #FF8AC8; }
      .t { stroke: #F9B4D9; } .tf { fill: #F9B4D9; }
    }
  </style>
  <path class="t" d="M0 58 Q 350 34 700 58" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <path id="op" class="v" d="M20 30 Q 350 -10 680 30" fill="none" stroke-width="1.5" stroke-dasharray="3 7" stroke-opacity=".6"/>
  <g class="vf">
    <rect x="-4" y="-4" width="8" height="8" rx="1.5"/>
    <rect x="-16" y="-2" width="9" height="4" opacity=".7"/><rect x="7" y="-2" width="9" height="4" opacity=".7"/>
    <animateMotion dur="2.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".5 0 .3 1">
      <mpath href="#op" xlink:href="#op"/>
    </animateMotion>
  </g>
  <polygon class="tf scan" points="680,30 660,52 700,52"/>
</svg>