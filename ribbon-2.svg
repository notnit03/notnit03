<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 70" width="700" height="70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    path { fill: none; stroke: #E0479E; stroke-width: 3; stroke-linecap: round;
           stroke-dasharray: 1400; stroke-dashoffset: 1400;
           animation: draw 2.4s cubic-bezier(.6,.05,.3,1) .3s forwards; }
    circle { fill: #B8327E; opacity: 0; animation: appear .4s ease 2.5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      path { stroke: #FF8AC8; }
      circle { fill: #F9B4D9; }
    }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; }
      circle { animation: none; opacity: 1; }
    }
  </style>
  <path d="M4 40 C 70 6, 120 66, 190 36 S 300 4, 350 38 S 430 70, 480 30 S 560 2, 610 34 C 640 52, 668 46, 690 30"/>
  <circle cx="690" cy="30" r="7"/>
</svg>
